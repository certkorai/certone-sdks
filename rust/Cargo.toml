[package]
name = "certone"
version = "0.1.0"
edition = "2021"
description = "Rust client for the CertOne control-plane API: submit AI compliance checks, poll reports, ingest run-at-source reports, fetch attestations."
license = "Apache-2.0"
repository = "https://github.com/certkorai/certone-sdks"
authors = ["Certkor AI"]
readme = "README.md"
keywords = ["certone", "compliance", "ai", "attestation", "sdk"]
categories = ["api-bindings"]
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[[example]]
name = "quickstart"
